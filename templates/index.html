<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mano - Vitrine Interativa</title>
    <style>
        /* ===== BASE ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: url('/static/fundo_pagina.png') no-repeat center center fixed;
            background-size: cover;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #e0e0e0;
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 1400px; margin: 0 auto; }

        /* ===== HEADER COM IMAGEM DE FUNDO E NEON ===== */
        .profile-header {
            text-align: center;
            padding: 50px 20px;
            background: url('/static/fotofundo1.png') no-repeat center center;
            background-size: cover;
            border-radius: 24px;
            margin-bottom: 40px;
            border: 2px solid rgba(0, 212, 255, 0.25);
            box-shadow: 0 0 30px rgba(0, 212, 255, 0.1), 0 4px 40px rgba(0, 0, 0, 0.3);
            position: relative;
            min-height: 300px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: all 0.3s ease;
        }
        .profile-header:hover {
            border-color: rgba(0, 212, 255, 0.5);
            box-shadow: 0 0 50px rgba(0, 212, 255, 0.2), 0 8px 60px rgba(0, 0, 0, 0.4);
        }
        .profile-header::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.7);;
            border-radius: 24px;
            z-index: 0;
        }
        .profile-header > * { position: relative; z-index: 1; }

        
        .profile-avatar:hover { 
            transform: scale(1.05); 
            box-shadow: 0 0 60px rgba(0,212,255,0.5), 0 10px 60px rgba(0,212,255,0.3);
            border-color: rgba(0,212,255,0.8);
        }
        .profile-avatar img { 
            width: 100%; 
            height: 100%; 
            object-fit: cover;
            display: block;
        }

        .profile-header h1 {
            font-size: 6rem;
            background: linear-gradient(135deg, #1ef08e, #eb1beb);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 80px rgba(0,212,255,0.2);
        }
        .profile-header .subtitle {
            background: linear-gradient(135deg, #c4e217, #30dce2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-size: 3rem;
            margin-top: 8px;
            font-weight: 500;
        }
        .profile-tags {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 15px;
        }
        .profile-tags .tag {
            background: rgba(0,212,255,0.15);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0,212,255,0.3);
            padding: 6px 18px;
            border-radius: 20px;
            font-size: 0.85rem;
            color: #00d4ff;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 0 15px rgba(0,212,255,0.1);
            transition: all 0.3s ease;
        }
        .profile-tags .tag:hover {
            border-color: rgba(0,212,255,0.6);
            box-shadow: 0 0 25px rgba(0,212,255,0.2);
        }

        /* ===== MÓDULOS COM NEON ===== */
        .modules-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 40px;
        }
        @media (max-width: 1200px) { .modules-grid { grid-template-columns: repeat(3, 1fr); } }
        @media (max-width: 900px) { .modules-grid { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 600px) { .modules-grid { grid-template-columns: 1fr; } }

        .module-card {
            border-radius: 16px;
            padding: 0;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
            position: relative;
            overflow: hidden;
            min-height: 220px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border: 2px solid rgba(0, 212, 255, 0.2);
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.08), 0 4px 30px rgba(0, 0, 0, 0.3);
            background-size: cover;
            background-position: center;
            background-color: rgba(255,255,255,0.03);
        }
        .module-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(10,10,26,0);
            transition: background 0.3s ease;
            border-radius: 16px;
        }
        .module-card:hover::before {
            background: rgba(10,10,26,0.1);
        }
        .module-card:hover {
            transform: translateY(-5px);
            border-color: rgba(0, 212, 255, 0.6);
            box-shadow: 0 0 40px rgba(0, 212, 255, 0.25), 0 8px 50px rgba(0, 0, 0, 0.5);
        }
        .module-card .module-img {
            display: none;
        }
        .module-card .icon { 
            display: none;
        }
        .module-card .title { 
            display: none;
        }
        .module-card .desc { 
            display: none;
        }
        .module-card .badge {
            position: absolute;
            top: 12px;
            right: 12px;
            background: rgba(0,212,255,0.2);
            padding: 2px 12px;
            border-radius: 12px;
            font-size: 0.65rem;
            color: #00d4ff;
            z-index: 2;
            border: 1px solid rgba(0,212,255,0.3);
            box-shadow: 0 0 15px rgba(0,212,255,0.1);
        }
        .module-card .click-hint {
            font-size: 0.7rem;
            color: #aaa;
            margin-top: 8px;
            opacity: 0;
            transition: opacity 0.3s ease;
            position: relative;
            z-index: 1;
            background: rgba(0,0,0,0.5);
            padding: 4px 16px;
            border-radius: 20px;
            border: 1px solid rgba(0,212,255,0.2);
        }
        .module-card:hover .click-hint { opacity: 1; }

        /* ===== MODAL COM NEON ===== */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.92);
            backdrop-filter: blur(16px);
            z-index: 1000;
            display: none;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 0.4s ease;
            padding: 20px;
        }
        .modal-overlay.aberto { display: flex; opacity: 1; }

        .modal-box {
            background: linear-gradient(145deg, #14142a, #1a1a35);
            border: 2px solid rgba(0, 212, 255, 0.15);
            box-shadow: 0 0 40px rgba(0, 212, 255, 0.08), 0 4px 50px rgba(0, 0, 0, 0.5);
            border-radius: 28px;
            max-width: 98%;
            width: 100%;
            max-height: 96%;
            height: 100%;
            padding: 30px 35px 30px;
            position: relative;
            transform: scale(0.95) translateY(15px);
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }
        .modal-overlay.aberto .modal-box { transform: scale(1) translateY(0); }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(0,212,255,0.1);
            flex-shrink: 0;
        }
        .modal-header .modal-title {
            font-size: 1.8rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .modal-header .modal-title .icon { font-size: 2rem; }
        .modal-header .modal-title .text {
            background: linear-gradient(135deg, #00d4ff, #7b2ffc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .modal-close {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.08);
            color: #888;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            font-size: 1.4rem;
            cursor: pointer;
            transition: all 0.3s ease;
            flex-shrink: 0;
        }
        .modal-close:hover {
            background: rgba(255,0,0,0.15);
            border-color: rgba(255,0,0,0.3);
            color: #ff4444;
            transform: rotate(90deg);
        }

        /* ===== SUB-ITENS COM NEON ===== */
        .sub-items-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 14px;
            flex: 1;
        }
        @media (max-width: 992px) { .sub-items-grid { grid-template-columns: repeat(3, 1fr); } }
        @media (max-width: 768px) { .sub-items-grid { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 480px) { .sub-items-grid { grid-template-columns: 1fr; } }

        .sub-item-btn {
            border-radius: 16px;
            padding: 0;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            min-height: 140px;
            gap: 6px;
            border: 2px solid rgba(0, 212, 255, 0.15);
            box-shadow: 0 0 15px rgba(0, 212, 255, 0.08), 0 4px 20px rgba(0, 0, 0, 0.3);
            background-size: cover;
            background-position: center;
            background-color: rgba(255,255,255,0.04);
            position: relative;
            overflow: hidden;
        }
        .sub-item-btn::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(10,10,26,0);
            transition: background 0.3s ease;
        }
        .sub-item-btn:hover::before {
            background: rgba(10,10,26,0.1);
        }
        .sub-item-btn:hover {
            transform: translateY(-4px) scale(1.02);
            border-color: rgba(0, 212, 255, 0.5);
            box-shadow: 0 0 30px rgba(0, 212, 255, 0.2), 0 8px 40px rgba(0, 0, 0, 0.4);
        }
        .sub-item-btn .sub-img {
            display: none;
        }
        .sub-item-btn .sub-icon { 
            font-size: 1.8rem;
            position: relative;
            z-index: 1;
            display: none;
        }
        .sub-item-btn .sub-title { 
            font-weight: 600; 
            color: #fff;
            font-size: 0.9rem;
            position: relative;
            z-index: 1;
            text-shadow: 0 2px 10px rgba(0,0,0,0.9);
            background: rgba(0,0,0,0.5);
            padding: 4px 14px;
            border-radius: 8px;
            display: none;
        }
        .sub-item-btn .sub-desc { 
            font-size: 0.7rem; 
            color: #aaa;
            position: relative;
            z-index: 1;
            background: rgba(0,0,0,0.4);
            padding: 2px 10px;
            border-radius: 6px;
            display: none;
        }

        /* ===== IMAGENS DENTRO DO MODAL COM NEON ===== */
        .subpage-box img, 
        .subpage-box video {
            width: 100%;
            max-width: 100%;
            border-radius: 12px;
            border: 2px solid rgba(0, 212, 255, 0.4);
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.2), 0 4px 30px rgba(0, 0, 0, 0.5);
            margin-bottom: 15px;
            transition: all 0.3s ease;
        }

        .subpage-box img:hover,
        .subpage-box video:hover {
            border-color: rgba(0, 212, 255, 0.8);
            box-shadow: 0 0 40px rgba(0, 212, 255, 0.4), 0 4px 40px rgba(0, 0, 0, 0.6);
            transform: scale(1.01);
        }

        /* ===== SUBPAGE ===== */
        .subpage-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.95);
            backdrop-filter: blur(20px);
            z-index: 2000;
            display: none;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 0.5s ease;
            padding: 25px;
        }
        .subpage-overlay.aberto { display: flex; opacity: 1; }

        .subpage-box {
            background: linear-gradient(145deg, #14142a, #1a1a35);
            border: 2px solid rgba(0, 212, 255, 0.15);
            box-shadow: 0 0 40px rgba(0, 212, 255, 0.08), 0 4px 50px rgba(0, 0, 0, 0.5);
            border-radius: 28px;
            max-width: 98%;
            width: 100%;
            max-height: 96%;
            height: 100%;
            padding: 35px 45px 35px;
            position: relative;
            transform: scale(0.95) translateY(20px);
            transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }
        .subpage-overlay.aberto .subpage-box { transform: scale(1) translateY(0); }

        .subpage-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            padding-bottom: 18px;
            border-bottom: 1px solid rgba(0,212,255,0.1);
            flex-shrink: 0;
        }
        .subpage-header .subpage-title {
            font-size: 2rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .subpage-header .subpage-title .icon { font-size: 2.2rem; }
        .subpage-header .subpage-title .text {
            background: linear-gradient(135deg, #00d4ff, #7b2ffc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .subpage-close {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.08);
            color: #888;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            font-size: 1.5rem;
            cursor: pointer;
            transition: all 0.3s ease;
            flex-shrink: 0;
        }
        .subpage-close:hover {
            background: rgba(255,0,0,0.15);
            border-color: rgba(255,0,0,0.3);
            color: #ff4444;
            transform: rotate(90deg);
        }

        .subpage-content { flex: 1; display: flex; flex-direction: column; gap: 20px; }
        .subpage-content textarea {
            width: 100%;
            min-height: 300px;
            max-height: 600px;
            background: rgba(0,0,0,0.3);
            border: 2px solid rgba(0,212,255,0.1);
            border-radius: 14px;
            color: #d0d0d0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 1.05rem;
            line-height: 1.8;
            padding: 18px 22px;
            resize: vertical;
            outline: none;
            box-sizing: border-box;
            transition: all 0.3s ease;
        }
        .subpage-content textarea:focus { 
            border-color: rgba(0,212,255,0.3);
            box-shadow: 0 0 20px rgba(0,212,255,0.1);
        }
        .subpage-content textarea::placeholder { color: #2a2a3a; font-style: italic; }

        .subpage-footer {
            margin-top: 20px;
            padding-top: 18px;
            border-top: 1px solid rgba(255,255,255,0.05);
            display: flex;
            justify-content: flex-end;
            gap: 14px;
            flex-shrink: 0;
        }
        .btn-subpage {
            padding: 12px 34px;
            border-radius: 12px;
            border: none;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .btn-subpage.primary {
            background: linear-gradient(135deg, #00d4ff, #7b2ffc);
            color: #fff;
            box-shadow: 0 0 25px rgba(0,212,255,0.2), 0 4px 25px rgba(0,212,255,0.2);
        }
        .btn-subpage.primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 40px rgba(0,212,255,0.3), 0 6px 35px rgba(0,212,255,0.3);
        }
        .btn-subpage.secondary {
            background: rgba(255,255,255,0.05);
            color: #888;
            border: 1px solid rgba(255,255,255,0.08);
        }
        .btn-subpage.secondary:hover { background: rgba(255,255,255,0.1); }

        /* ===== FOOTER DO MODAL ===== */
        .modal-footer {
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid rgba(255,255,255,0.05);
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            flex-shrink: 0;
        }
        .btn-modal {
            padding: 10px 28px;
            border-radius: 10px;
            border: none;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .btn-modal.primary {
            background: linear-gradient(135deg, #00d4ff, #7b2ffc);
            color: #fff;
            box-shadow: 0 0 20px rgba(0,212,255,0.2), 0 4px 20px rgba(0,212,255,0.2);
        }
        .btn-modal.primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 35px rgba(0,212,255,0.3), 0 6px 30px rgba(0,212,255,0.3);
        }
        .btn-modal.secondary {
            background: rgba(255,255,255,0.05);
            color: #888;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .btn-modal.secondary:hover { background: rgba(255,255,255,0.1); }

        /* ===== FAB COM NEON ===== */
        .fab {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: linear-gradient(135deg, #00d4ff, #7b2ffc);
            border: 2px solid rgba(0, 212, 255, 0.3);
            padding: 14px 28px;
            border-radius: 50px;
            color: #fff;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 30px rgba(0, 212, 255, 0.2), 0 4px 30px rgba(0, 0, 0, 0.3);
            z-index: 100;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .fab:hover {
            transform: translateY(-3px) scale(1.02);
            border-color: rgba(0, 212, 255, 0.8);
            box-shadow: 0 0 50px rgba(0, 212, 255, 0.4), 0 8px 50px rgba(0, 0, 0, 0.4);
        }

        /* ===== TOAST ===== */
        .toast {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            padding: 14px 32px;
            border-radius: 12px;
            color: #fff;
            font-weight: 500;
            z-index: 3000;
            opacity: 0;
            transition: all 0.5s cubic-bezier(0.4,0,0.2,1);
            max-width: 90%;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            border: 1px solid rgba(0,212,255,0.2);
        }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
        .toast.success { background: linear-gradient(135deg, #00c853, #00e676); }
        .toast.error { background: linear-gradient(135deg, #d50000, #ff1744); }
        .toast.info { background: linear-gradient(135deg, #2962ff, #448aff); }

        /* ===== SCROLLBAR ===== */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: rgba(255,255,255,0.02); }
        ::-webkit-scrollbar-thumb { background: rgba(0,212,255,0.3); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(0,212,255,0.5); }
    </style>
</head>
<body>
    <div class="container">

        <!-- ===== PERFIL ===== -->
        <div class="profile-header">
            <h1 id="profileName">Meu Curriculo</h1>
            <div class="subtitle" id="profileSubtitle">Este é um currículo interativo, esta dividido em categorias e subcategorias</div>
            <div class="profile-tags" id="profileTags"></div>
        </div>

        <!-- ===== MÓDULOS ===== -->
        <div id="modulesGrid" class="modules-grid"></div>
    </div>

    <!-- ===== MODAL ===== -->
    <div id="modalOverlay" class="modal-overlay" onclick="fecharModal(event)">
        <div class="modal-box" onclick="event.stopPropagation()">
            <div class="modal-header">
                <div class="modal-title">
                    <span class="icon" id="modalIcon">📁</span>
                    <span class="text" id="modalTitle">Módulo</span>
                </div>
                <button class="modal-close" onclick="fecharModal()">✕</button>
            </div>
            <div id="subItemsContainer" class="sub-items-grid"></div>
            <div class="modal-footer">
                <button class="btn-modal secondary" onclick="fecharModal()">Fechar</button>
                <button class="btn-modal primary" onclick="salvarDados()">💾 Salvar</button>
            </div>
        </div>
    </div>

    <!-- ===== SUBPAGE ===== -->
    <div id="subpageOverlay" class="subpage-overlay" onclick="fecharSubpage(event)">
        <div class="subpage-box" onclick="event.stopPropagation()">
            <div class="subpage-header">
                <div class="subpage-title">
                    <span class="icon" id="subpageIcon">📄</span>
                    <span class="text" id="subpageTitle">Sub-Item</span>
                </div>
                <button class="subpage-close" onclick="fecharSubpage()">✕</button>
            </div>
            <div class="subpage-content">
                <textarea id="subpageTextarea" placeholder="Digite sua história aqui..."></textarea>
            </div>
            <div class="subpage-footer">
                <button class="btn-subpage secondary" onclick="fecharSubpage()">Fechar</button>
                <button class="btn-subpage primary" onclick="salvarSubpage()">💾 Salvar</button>
            </div>
        </div>
    </div>

    <!-- ===== FAB ===== -->
    <button class="fab" onclick="exportarCurriculo()">📤 Exportar</button>

    <!-- ===== TOAST ===== -->
    <div id="toast" class="toast"></div>

    <script>
        // ================================================================
        // ⭐ DADOS DO CURRÍCULO - EDITE AQUI! ⭐
        // ================================================================
        const STATIC_URL = '/static/';
        
        const dadosCurriculo = {
            perfil: {
                nome: "Meu Curriculo",
                imagemFundo: STATIC_URL + "fotofundo1.png",
                subtitulo: "Este é um currículo interativo, clique nos botões para acessar cada categoria",
                tags: [
                    { nome: "Minha/história", icone: "💼" },
                    { nome: "Programador", icone: "🖥️" },
                    { nome: "SQL", icone: "👮‍♂️" }, 
                    { nome: "Apex_logic_Systems", icone: "🤖" },
                    { nome: "WebStruct.Analyzer", icone: "🌍" },
                    { nome: "Coleta.de.dados/scraping", icone: "🕵️‍♀️" }
                ]
            },
            modulos: [
                {

        // ================================================================
        // ESTADO
        // ================================================================
        let dados = JSON.parse(JSON.stringify(dadosCurriculo));
        let modalAtual = null;
        let subpageAtual = null;

        // ================================================================
        // RENDERIZAR PERFIL
        // ================================================================
        function renderizarPerfil() {
            const p = dados.perfil || {};
            
            const avatar = document.getElementById('avatarContainer');
            if (avatar) {
                if (p.avatar && (p.avatar.includes('.png') || p.avatar.includes('.jpg'))) {
                    avatar.innerHTML = `<img src="${p.avatar}" alt="Avatar" onerror="this.style.display='none';this.parentElement.textContent='🧑‍💻'">`;
                } else {
                    avatar.textContent = p.avatar || '🧑‍💻';
                }
            }

            const header = document.querySelector('.profile-header');
            if (header && p.imagemFundo) {
                header.style.backgroundImage = `url('${p.imagemFundo}')`;
            }

            const tagsContainer = document.getElementById('profileTags');
            if (tagsContainer) {
                tagsContainer.innerHTML = '';
                const tags = (p.tags && p.tags.length > 0) ? p.tags : [
                    { nome: 'Python', icone: '🐍' }, { nome: 'C#', icone: '⚡' },
                    { nome: 'Automação', icone: '🤖' }, { nome: 'IA Local', icone: '🧠' },
                    { nome: 'Flask', icone: '🚀' }
                ];
                tags.forEach(tag => {
                    const span = document.createElement('span');
                    span.className = 'tag';
                    span.textContent = `${tag.icone || '📌'} ${tag.nome || 'Tag'}`;
                    tagsContainer.appendChild(span);
                });
            }
        }

        // ================================================================
        // RENDERIZAR MÓDULOS
        // ================================================================
        function renderizarModulos() {
            const grid = document.getElementById('modulesGrid');
            grid.innerHTML = '';
            dados.modulos.forEach(mod => {
                const card = document.createElement('div');
                card.className = 'module-card';
                
                const bgStyle = mod.imagem ? `background-image: url('${mod.imagem}');` : '';
                card.setAttribute('style', bgStyle);
                card.innerHTML = `
                    <div class="click-hint">👆 Clique para abrir</div>
                `;
                card.addEventListener('click', () => abrirModal(mod.id));
                grid.appendChild(card);
            });
        }

        // ================================================================
        // ABRIR MODAL
        // ================================================================
        function abrirModal(moduloId) {
            const mod = dados.modulos.find(m => m.id === moduloId);
            if (!mod) return;
            modalAtual = moduloId;
            document.getElementById('modalIcon').textContent = '📁';
            document.getElementById('modalTitle').textContent = 'Módulo';
            const container = document.getElementById('subItemsContainer');
            container.innerHTML = '';
            mod.subitens.forEach((sub) => {
                const btn = document.createElement('div');
                btn.className = 'sub-item-btn';
                const bgStyle = sub.imagem ? `background-image: url('${sub.imagem}');` : '';
                btn.setAttribute('style', bgStyle);
                btn.innerHTML = '';
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    abrirSubpage(sub.id);
                });
                container.appendChild(btn);
            });
            document.getElementById('modalOverlay').classList.add('aberto');
            document.body.style.overflow = 'hidden';
        }

        function fecharModal(event) {
            if (event && event.target !== event.currentTarget) return;
            document.getElementById('modalOverlay').classList.remove('aberto');
            document.body.style.overflow = '';
            modalAtual = null;
        }

        // ================================================================
        // SUBPAGE
        // ================================================================
        function abrirSubpage(subId) {
            let subEncontrado = null;
            for (const mod of dados.modulos) {
                for (const sub of mod.subitens) {
                    if (sub.id === subId) { subEncontrado = sub; break; }
                }
                if (subEncontrado) break;
            }
            if (!subEncontrado) return;
            subpageAtual = subId;
            document.getElementById('subpageIcon').textContent = subEncontrado.icone || '📄';
            document.getElementById('subpageTitle').textContent = subEncontrado.titulo;
            document.getElementById('subpageTextarea').value = subEncontrado.texto || '';
            document.getElementById('subpageOverlay').classList.add('aberto');
            document.body.style.overflow = 'hidden';
        }

        function fecharSubpage(event) {
            if (event && event.target !== event.currentTarget) return;
            document.getElementById('subpageOverlay').classList.remove('aberto');
            document.body.style.overflow = '';
            subpageAtual = null;
        }

        // ================================================================
        // SALVAR
        // ================================================================
        function salvarSubpage() {
            if (!subpageAtual) return;
            const texto = document.getElementById('subpageTextarea').value;
            for (const mod of dados.modulos) {
                for (const sub of mod.subitens) {
                    if (sub.id === subpageAtual) { sub.texto = texto; break; }
                }
            }
            localStorage.setItem('curriculo_dados', JSON.stringify(dados));
            showToast('✅ Dados salvos com sucesso!', 'success');
            fecharSubpage();
        }

        function salvarDados() {
            localStorage.setItem('curriculo_dados', JSON.stringify(dados));
            showToast('✅ Dados salvos com sucesso!', 'success');
        }

        function exportarCurriculo() {
            salvarDados();
            const blob = new Blob([JSON.stringify(dados, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `curriculo_${new Date().toISOString().slice(0,10)}.json`;
            a.click();
            URL.revokeObjectURL(url);
            showToast('📤 Currículo exportado!', 'info');
        }

        function carregarDados() {
            const salvos = localStorage.getItem('curriculo_dados');
            if (salvos) {
                try {
                    const parsed = JSON.parse(salvos);
                    if (parsed.modulos && parsed.modulos.length > 0 && parsed.perfil) {
                        dados = parsed;
                    }
                } catch(e) { console.warn('Erro ao carregar dados'); }
            }
        }

        function showToast(mensagem, tipo = 'info') {
            const toast = document.getElementById('toast');
            toast.textContent = mensagem;
            toast.className = `toast ${tipo}`;
            void toast.offsetWidth;
            toast.classList.add('show');
            clearTimeout(toast._timeout);
            toast._timeout = setTimeout(() => toast.classList.remove('show'), 3000);
        }

        // ================================================================
        // INIT
        // ================================================================
        function init() {
            carregarDados();
            renderizarPerfil();
            renderizarModulos();
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') { fecharModal(); fecharSubpage(); }
            });
        }
        init();
    </script>
