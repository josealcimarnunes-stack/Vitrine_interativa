<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block titulo %}Mano - Vitrine Interativa{% endblock %}</title>
    
    <!-- ===== FORÇA SEM CACHE ===== -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    
    <style>
        /* ===== BASE ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: url('/static/images/fundos/fundo_pagina.webp?{{ versao }}') no-repeat center center fixed;
            background-size: cover;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #56cfbb;
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 1400px; margin: 0 auto; }

        /* ===== HEADER ===== */
        .profile-header {
            text-align: center;
            padding: 50px 20px;
            background: url('/static/images/fundos/fotofundo1.webp?{{ versao }}') no-repeat center center;
            background-size: cover;
            border-radius: 24px;
            margin-bottom: 40px;
            border: 2px solid rgba(219, 72, 170, 0.25);
            box-shadow: 0 0 30px rgba(0, 212, 255, 0.1), 0 4px 40px rgba(0, 0, 0, 0.3);
            position: relative;
            min-height: 300px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: all 0.3s ease;
        }
        .profile-header:hover {
            border-color: rgba(84, 201, 48, 0.5);
            box-shadow: 0 0 50px rgba(0, 212, 255, 0.2), 0 8px 60px rgba(0, 0, 0, 0.4);
        }
        .profile-header::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            border-radius: 24px;
            z-index: 0;
        }
        .profile-header > * { position: relative; z-index: 1; }

        .profile-header h1 {
            font-size: 5rem;
            background: linear-gradient(135deg,  #df0b77, #29e1e1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 80px rgba(0,212,255,0.2);
        }
        .profile-header .subtitle {
            background: linear-gradient(135deg, #c4e217, #30dce2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-size: 1.2rem;
            margin-top: 8px;
            font-weight: 500;
        }

        .profile-tags {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 15px;
        }
        .profile-tags .tag {
            background: rgba(0,212,255,0.15);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0,212,255,0.3);
            padding: 6px 18px;
            border-radius: 20px;
            font-size: 0.85rem;
            color: #00d4ff;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 0 15px rgba(0,212,255,0.1);
            transition: all 0.3s ease;
        }
        .profile-tags .tag:hover {
            border-color: rgba(0,212,255,0.6);
            box-shadow: 0 0 25px rgba(0,212,255,0.2);
        }

        .profile-avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 3px solid rgba(0, 212, 255, 0.4);
            box-shadow: 0 0 30px rgba(0, 212, 255, 0.2);
            overflow: hidden;
            margin-bottom: 15px;
            transition: all 0.3s ease;
            background: rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4rem;
        }
        .profile-avatar:hover { 
            transform: scale(1.05); 
            box-shadow: 0 0 60px rgba(0,212,255,0.5), 0 10px 60px rgba(0,212,255,0.3);
            border-color: rgba(0,212,255,0.8);
        }
        .profile-avatar img { 
            width: 100%; 
            height: 100%; 
            object-fit: cover;
            display: block;
        }

        /* ===== BOTÃO VOLTAR ===== */
        .btn-voltar {
            display: inline-block;
            margin-bottom: 20px;
            padding: 12px 24px;
            background: rgba(0,212,255,0.15);
            border: 1px solid rgba(0,212,255,0.3);
            border-radius: 12px;
            color: #00d4ff;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        .btn-voltar:hover {
            background: rgba(0,212,255,0.25);
            border-color: rgba(0,212,255,0.6);
            box-shadow: 0 0 30px rgba(0,212,255,0.2);
        }

        /* ===== CONTEÚDO DAS CATEGORIAS ===== */
        .categoria-content {
    background: transparent !important;
    border: none !important;
    padding: 0 !important;
    min-height: auto;
}

        /* ===== MÓDULOS GRID (só no index) ===== */
        .modules-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 40px;
        }
        @media (max-width: 1200px) { .modules-grid { grid-template-columns: repeat(3, 1fr); } }
        @media (max-width: 900px) { .modules-grid { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 600px) { .modules-grid { grid-template-columns: 1fr; } }

        .module-card {
            border-radius: 16px;
            padding: 0;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
            position: relative;
            overflow: hidden;
            min-height: 220px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border: 2px solid rgba(0, 212, 255, 0.2);
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.08), 0 4px 30px rgba(0, 0, 0, 0.3);
            background-size: cover;
            background-position: center;
            background-color: rgba(255,255,255,0.03);
            text-decoration: none;
            color: #42b5bd;
        }
        .module-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(10,10,26,0);
            transition: background 0.3s ease;
            border-radius: 16px;
        }
        .module-card:hover::before {
            background: rgba(10,10,26,0.1);
        }
        .module-card:hover {
            transform: translateY(-5px);
            border-color: rgba(0, 212, 255, 0.6);
            box-shadow: 0 0 40px rgba(0, 212, 255, 0.25), 0 8px 50px rgba(0, 0, 0, 0.5);
        }
        .module-card .card-hint {
            font-size: 0.7rem;
            color: #aaa;
            margin-top: 8px;
            opacity: 0;
            transition: opacity 0.3s ease;
            position: relative;
            z-index: 1;
            background: rgba(0,0,0,0.5);
            padding: 4px 16px;
            border-radius: 20px;
            border: 1px solid rgba(0,212,255,0.2);
        }
        .module-card:hover .card-hint { opacity: 1; }

        /* ===== SUB-ITENS ===== */
        .sub-items-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 14px;
            margin-top: 20px;
        }
        @media (max-width: 992px) { .sub-items-grid { grid-template-columns: repeat(3, 1fr); } }
        @media (max-width: 768px) { .sub-items-grid { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 480px) { .sub-items-grid { grid-template-columns: 1fr; } }

        .sub-item-card {
            border-radius: 16px;
            padding: 0;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            min-height: 140px;
            gap: 6px;
            border: 2px solid rgba(0, 212, 255, 0.15);
            box-shadow: 0 0 15px rgba(0, 212, 255, 0.08), 0 4px 20px rgba(0, 0, 0, 0.3);
            background-size: cover;
            background-position: center;
            background-color: rgba(255,255,255,0.04);
            position: relative;
            overflow: hidden;
            text-decoration: none;
            color: #2db97f;
        }
        .sub-item-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(10,10,26,0);
            transition: background 0.3s ease;
        }
        .sub-item-card:hover::before {
            background: rgba(10,10,26,0.1);
        }
        .sub-item-card:hover {
            transform: translateY(-4px) scale(1.02);
            border-color: rgba(0, 212, 255, 0.5);
            box-shadow: 0 0 30px rgba(0, 212, 255, 0.2), 0 8px 40px rgba(0, 0, 0, 0.4);
        }
        .sub-item-card .sub-label {
            font-weight: 600; 
            color: #22a9ad;
            font-size: 0.9rem;
            position: relative;
            z-index: 1;
            text-shadow: 0 2px 10px rgba(0,0,0,0.9);
            background: rgba(0,0,0,0.5);
            padding: 4px 14px;
            border-radius: 8px;
        }
        .sub-item-card .sub-icon {
            font-size: 2rem;
            position: relative;
            z-index: 1;
        }

        /* ===== SCROLLBAR ===== */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: rgba(255,255,255,0.02); }
        ::-webkit-scrollbar-thumb { background: rgba(0,212,255,0.3); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(0,212,255,0.5); }

        /* ===== FAB ===== */
        .fab {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: linear-gradient(135deg, #00d4ff, #7b2ffc);
            border: 2px solid rgba(0, 212, 255, 0.3);
            padding: 14px 28px;
            border-radius: 50px;
            color: #73c527;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 30px rgba(0, 212, 255, 0.2), 0 4px 30px rgba(0, 0, 0, 0.3);
            z-index: 100;
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
        }
        .fab:hover {
            transform: translateY(-3px) scale(1.02);
            border-color: rgba(0, 212, 255, 0.8);
            box-shadow: 0 0 50px rgba(0, 212, 255, 0.4), 0 8px 50px rgba(0, 0, 0, 0.4);
        }

        /* ===== TOAST ===== */
        .toast {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            padding: 14px 32px;
            border-radius: 12px;
            color: #fff;
            font-weight: 500;
            z-index: 3000;
            opacity: 0;
            transition: all 0.5s cubic-bezier(0.4,0,0.2,1);
            max-width: 90%;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            border: 1px solid rgba(0,212,255,0.2);
        }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
        .toast.success { background: linear-gradient(135deg, #00c853, #00e676); }
        .toast.error { background: linear-gradient(135deg, #d50000, #ff1744); }
        .toast.info { background: linear-gradient(135deg, #2962ff, #448aff); }
    </style>
</head>
<body>
    <div class="container">
        <!-- ===== HEADER ===== -->
        <div class="profile-header">
    <h1>{% block nome %}Meu Curriculo{% endblock %}</h1>
    <div class="subtitle">{% block subtitulo %}Currículo Interativo{% endblock %}</div>
    <div class="profile-tags">
        {% block tags %}
            <span class="tag">💼 Minha História</span>
            <span class="tag">🖥️ Programador</span>
            <span class="tag">👮‍♂️ SQL</span>
            <span class="tag">🤖 Apex Logic Systems</span>
            <span class="tag">🌍 WebStruct.Analyzer</span>
            <span class="tag">🕵️ Coleta de dados</span>
        {% endblock %}
    </div>
</div>

        <!-- ===== CONTEÚDO PRINCIPAL ===== -->
        {% block conteudo %}{% endblock %}

        <!-- ===== FAB ===== -->
        <a href="/" class="fab">🏠 Voltar</a>
    </div>

    <!-- ===== TOAST ===== -->
    <div id="toast" class="toast"></div>

    <script>
        function showToast(mensagem, tipo = 'info') {
            const toast = document.getElementById('toast');
            toast.textContent = mensagem;
            toast.className = `toast ${tipo}`;
            void toast.offsetWidth;
            toast.classList.add('show');
            clearTimeout(toast._timeout);
            toast._timeout = setTimeout(() => toast.classList.remove('show'), 3000);
        }
        
        console.log('🔄 Versão do site: {{ versao }}');
    </script>
</body>
</html>
