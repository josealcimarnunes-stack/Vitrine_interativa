{% extends "base.html" %}

{% block titulo %}📖 Quem Sou Eu?{% endblock %}

<!-- ===== BLOQUEIA HEADER ===== -->
{% block nome %}{% endblock %}
{% block subtitulo %}{% endblock %}
{% block tags %}{% endblock %}

{% block conteudo %}

<style>
    body {
        background: #0a0a1a !important;
        background-image: none !important;
    }

    .categoria-content {
        max-width: 1100px;
        margin: 0 auto;
        padding: 20px;
    }

    .btn-voltar {
        display: inline-block;
        margin-bottom: 20px;
        padding: 12px 24px;
        background: rgba(0,212,255,0.15);
        border: 1px solid rgba(0,212,255,0.3);
        border-radius: 12px;
        color: #00d4ff;
        text-decoration: none;
        font-weight: 600;
        transition: all 0.3s ease;
    }
    .btn-voltar:hover {
        background: rgba(0,212,255,0.25);
        border-color: rgba(0,212,255,0.6);
        box-shadow: 0 0 30px rgba(0,212,255,0.2);
    }

    /* ===== TÍTULO ===== */
    .page-title {
        text-align: center;
        font-size: 3.5rem;
        font-weight: 900;
        color: #ffd700;
        margin-bottom: 30px;
        text-shadow: 0 0 60px rgba(255,215,0,0.15);
        letter-spacing: 4px;
    }
    .page-title span {
        display: inline-block;
        animation: titleGlow 2s ease-in-out infinite alternate;
    }
    @keyframes titleGlow {
        0% { text-shadow: 0 0 30px rgba(255,215,0,0.1); }
        100% { text-shadow: 0 0 80px rgba(255,215,0,0.3); }
    }

    /* ===== GRID DOS 6 CARDS ===== */
    .cards-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 16px;
        margin-top: 10px;
    }

    .card-item {
        background: rgba(255,255,255,0.04);
        border: 2px solid rgba(0,212,255,0.15);
        border-radius: 16px;
        min-height: 200px;
        cursor: pointer;
        transition: all 0.3s ease;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 0 20px rgba(0,0,0,0.2);
        position: relative;
        overflow: hidden;
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
    }
    .card-item:hover {
        border-color: #ffd700;
        transform: translateY(-5px);
        box-shadow: 0 0 40px rgba(255,215,0,0.15);
    }

    /* ===== ÍCONE DE FUNDO QUANDO NÃO TEM IMAGEM ===== */
    .card-item .card-hint {
        font-size: 3rem;
        color: rgba(255,255,255,0.08);
        user-select: none;
    }

    /* ===== MODAL (QUASE TELA INTEIRA) ===== */
    #modalOverlay {
        display: none;
        position: fixed;
        top: 0; left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0,0,0,0.93);
        backdrop-filter: blur(15px);
        z-index: 9999;
        align-items: center;
        justify-content: center;
        padding: 30px;
        animation: modalFadeIn 0.4s ease;
    }
    @keyframes modalFadeIn {
        0% { opacity: 0; }
        100% { opacity: 1; }
    }

    #modalOverlay .modal-box {
        background: rgba(10,10,30,0.98);
        border: 2px solid rgba(255,215,0,0.3);
        border-radius: 24px;
        max-width: 900px;
        width: 100%;
        max-height: 92vh;
        overflow-y: auto;
        padding: 30px;
        position: relative;
        box-shadow: 0 0 80px rgba(255,215,0,0.08);
        animation: modalPop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    @keyframes modalPop {
        0% { transform: scale(0.85); opacity: 0; }
        100% { transform: scale(1); opacity: 1; }
    }

    #modalOverlay .modal-box .modal-fechar {
        position: absolute;
        top: 15px;
        right: 20px;
        background: none;
        border: none;
        color: #ffd700;
        font-size: 2.5rem;
        cursor: pointer;
        transition: transform 0.3s ease;
        z-index: 10;
        opacity: 0.7;
    }
    #modalOverlay .modal-box .modal-fechar:hover {
        transform: rotate(90deg) scale(1.2);
        opacity: 1;
    }

    #modalOverlay .modal-box .modal-imagem {
        width: 100%;
        height: auto;
        max-height: 75vh;
        object-fit: contain;
        border-radius: 16px;
        display: block;
        margin: 0 auto;
    }

    /* ===== ESCONDE HEADER ===== */
    .profile-header { display: none !important; }

    /* ===== RESPONSIVO ===== */
    @media (max-width: 768px) {
        .cards-grid { grid-template-columns: repeat(2, 1fr); }
        .card-item { min-height: 160px; }
        .page-title { font-size: 2.5rem; }
        #modalOverlay .modal-box { padding: 20px; }
        #modalOverlay .modal-box .modal-imagem { max-height: 55vh; }
    }
    @media (max-width: 480px) {
        .cards-grid { grid-template-columns: 1fr 1fr; gap: 10px; }
        .card-item { min-height: 120px; }
        .page-title { font-size: 1.8rem; }
        #modalOverlay { padding: 15px; }
        #modalOverlay .modal-box { padding: 15px; }
        #modalOverlay .modal-box .modal-imagem { max-height: 45vh; }
        #modalOverlay .modal-box .modal-fechar { font-size: 2rem; top: 10px; right: 15px; }
    }
</style>

<div class="categoria-content">
    <a href="/" class="btn-voltar">← Voltar para o índice</a>

    <div class="page-title">
      <span> PROJETO EM CRIAÇÃO</span>
    </div>

    <div class="cards-grid" id="cardsGrid">
        <!-- Os cards são gerados pelo JavaScript -->
    </div>
</div>

<!-- ===== MODAL ===== -->
<div id="modalOverlay" onclick="fecharModal()">
    <div class="modal-box" onclick="event.stopPropagation()">
        <button class="modal-fechar" onclick="fecharModal()">✕</button>
        <div id="modalConteudo"></div>
    </div>
</div>

<script>
    // ================================================================
    // ===== CONFIGURAÇÃO (EDITE AQUI) =====
    // ================================================================

   const dados = [
        {
            card: '/static/images/subitens/3_IMAGEM_1.png',    // imagem do card
            modal: '/static/images/subitens/3_IMAGEM_01.png'   // imagem do modal
        },
        {
            card: '/static/images/subitens/3_IMAGEM_2.png',
            modal: '/static/images/subitens/3_IMAGEM_02.png'
        },
        {
            card: '/static/images/subitens/3_IMAGEM_3.png',
            modal: '/static/images/subitens/3_IMAGEM_03.png'
        },
        {
            card: '/static/images/subitens/3_IMAGEM_4.png',
            modal: '/static/images/subitens/3_IMAGEM_04.png'
        },
        {
            card: '/static/images/subitens/3_IMAGEM_5.png',
            modal: '/static/images/subitens/SUA_IMAGEM_05.png'
        },
        {
            card: '/static/images/subitens/3_IMAGEM_6.png',
            modal: '/static/images/subitens/3_IMAGEM_6.png'
        }
    ];
    // ================================================================
    // ===== RENDERIZA OS CARDS =====
    // ================================================================

    function renderizarCards() {
        const grid = document.getElementById('cardsGrid');
        grid.innerHTML = '';

        dados.forEach((item, index) => {
            const card = document.createElement('div');
            card.className = 'card-item';
            card.style.backgroundImage = `url('${item.card}')`;

            // Se a imagem não carregar, mostra o ícone de fallback
            const imgTest = new Image();
            imgTest.onerror = function() {
                card.style.backgroundImage = 'none';
                card.innerHTML = `<span class="card-hint">🖼️</span>`;
            };
            imgTest.src = item.card;

            card.onclick = () => abrirModal(index);
            grid.appendChild(card);
        });
    }

    // ================================================================
    // ===== FUNÇÕES DO MODAL =====
    // ================================================================

    function abrirModal(index) {
        const item = dados[index];
        if (!item) return;

        const container = document.getElementById('modalConteudo');
        container.innerHTML = `
            <img src="${item.modal}" class="modal-imagem" onerror="this.parentElement.innerHTML='<div style=\\'text-align:center; color:#666; padding:40px;\\'>❌ Imagem não encontrada</div>'">
        `;

        document.getElementById('modalOverlay').style.display = 'flex';
        document.body.style.overflow = 'hidden';
    }

    function fecharModal() {
        document.getElementById('modalOverlay').style.display = 'none';
        document.body.style.overflow = '';
    }

    document.addEventListener('keydown', e => {
        if (e.key === 'Escape') fecharModal();
    });

    // ================================================================
    // ===== INICIALIZA =====
    // ================================================================

    renderizarCards();
</script>

{% endblock %}
