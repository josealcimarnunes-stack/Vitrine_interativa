{% extends "base.html" %}

{% block titulo %}🎬 Projeto em Vídeo{% endblock %}

<!-- ===== BLOQUEIA HEADER ===== -->
{% block nome %}{% endblock %}
{% block subtitulo %}{% endblock %}
{% block tags %}{% endblock %}

{% block conteudo %}

<style>
    body {
        background: #0a0a1a !important;
        background-image: none !important;
    }

    .categoria-content {
        max-width: 1100px;
        margin: 0 auto;
        padding: 20px;
        text-align: center;
        min-height: 80vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
    }

    .btn-voltar {
        display: inline-block;
        margin-bottom: 30px;
        padding: 12px 24px;
        background: rgba(0,212,255,0.15);
        border: 1px solid rgba(0,212,255,0.3);
        border-radius: 12px;
        color: #00d4ff;
        text-decoration: none;
        font-weight: 600;
        transition: all 0.3s ease;
        position: absolute;
        top: 20px;
        left: 20px;
        z-index: 10;
    }
    .btn-voltar:hover {
        background: rgba(0,212,255,0.25);
        border-color: rgba(0,212,255,0.6);
        box-shadow: 0 0 30px rgba(0,212,255,0.2);
    }

    .page-title {
        font-size: 3rem;
        font-weight: 900;
        color: #ffd700;
        margin-bottom: 20px;
        text-shadow: 0 0 60px rgba(255,215,0,0.15);
        letter-spacing: 4px;
    }

    .page-subtitle {
        color: #aaa;
        font-size: 1.1rem;
        margin-bottom: 40px;
        opacity: 0.7;
    }

    .btn-play {
        display: inline-flex;
        align-items: center;
        gap: 16px;
        padding: 24px 60px;
        background: linear-gradient(135deg, #ffd700, #ff6b00);
        border: none;
        border-radius: 60px;
        color: #0a0a1a;
        font-size: 1.6rem;
        font-weight: 800;
        cursor: pointer;
        transition: all 0.3s ease;
        box-shadow: 0 0 60px rgba(255,215,0,0.15);
    }
    .btn-play:hover {
        transform: scale(1.05);
        box-shadow: 0 0 80px rgba(255,215,0,0.35);
    }
    .btn-play .icone {
        font-size: 2.2rem;
    }

    #modalOverlay {
        display: none;
        position: fixed;
        top: 0; left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0,0,0,0.92);
        backdrop-filter: blur(12px);
        z-index: 9999;
        align-items: center;
        justify-content: center;
        padding: 30px;
        animation: modalFadeIn 0.3s ease;
    }
    @keyframes modalFadeIn {
        0% { opacity: 0; }
        100% { opacity: 1; }
    }

    #modalOverlay .modal-box {
        background: rgba(10,10,30,0.95);
        border: 2px solid rgba(255,215,0,0.2);
        border-radius: 24px;
        max-width: 900px;
        width: 100%;
        padding: 20px;
        position: relative;
        box-shadow: 0 0 80px rgba(255,215,0,0.06);
        animation: modalPop 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    @keyframes modalPop {
        0% { transform: scale(0.9) rotate(-2deg); opacity: 0; }
        100% { transform: scale(1) rotate(0); opacity: 1; }
    }

    #modalOverlay .modal-box .modal-fechar {
        position: absolute;
        top: 12px;
        right: 18px;
        background: rgba(255,255,255,0.05);
        border: 1px solid rgba(255,215,0,0.15);
        border-radius: 50%;
        width: 44px;
        height: 44px;
        color: #ffd700;
        font-size: 1.8rem;
        cursor: pointer;
        transition: all 0.3s ease;
        z-index: 10;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    #modalOverlay .modal-box .modal-fechar:hover {
        background: rgba(255,215,0,0.15);
        transform: rotate(90deg);
    }

    #modalOverlay .modal-box video {
        width: 100%;
        height: auto;
        max-height: 78vh;
        border-radius: 16px;
        display: block;
        margin: 0 auto;
        background: #000;
        box-shadow: 0 0 60px rgba(0,0,0,0.5);
    }

    .profile-header { display: none !important; }

    @media (max-width: 768px) {
        .page-title { font-size: 2rem; }
        .btn-play { font-size: 1.2rem; padding: 18px 30px; }
        .btn-play .icone { font-size: 1.6rem; }
        #modalOverlay .modal-box { padding: 12px; }
        #modalOverlay .modal-box video { max-height: 55vh; }
        .btn-voltar { font-size: 0.8rem; padding: 8px 16px; top: 10px; left: 10px; }
    }
    @media (max-width: 480px) {
        .page-title { font-size: 1.5rem; }
        .page-subtitle { font-size: 0.9rem; }
        .btn-play { font-size: 1rem; padding: 14px 20px; gap: 10px; }
        #modalOverlay { padding: 15px; }
        #modalOverlay .modal-box video { max-height: 45vh; }
    }
</style>

<div class="categoria-content">
    <a href="/" class="btn-voltar">← Voltar</a>

    <div class="page-title">🎬 VÍDEO DO PROJETO</div>
    <div class="page-subtitle">Clique no botão abaixo para assistir</div>

    <button class="btn-play" onclick="abrirVideo()">
        <span class="icone">▶️</span>
        ASSISTIR VÍDEO
    </button>
</div>

<!-- ===== MODAL ===== -->
<div id="modalOverlay" onclick="fecharModal()">
    <div class="modal-box" onclick="event.stopPropagation()">
        <button class="modal-fechar" onclick="fecharModal()">✕</button>
        <div id="modalConteudo">
            <video id="meuVideo" controls>
                <source src="/static/images/subitens/teste9.mp4" type="video/mp4">
                Seu navegador não suporta vídeos.
            </video>
        </div>
    </div>
</div>

<script>
    function abrirVideo() {
        const modal = document.getElementById('modalOverlay');
        const video = document.getElementById('meuVideo');
        
        modal.style.display = 'flex';
        document.body.style.overflow = 'hidden';
        
        video.load();
        setTimeout(() => {
            video.play().catch(e => console.log('Autoplay bloqueado'));
        }, 100);
    }

    function fecharModal() {
        const modal = document.getElementById('modalOverlay');
        const video = document.getElementById('meuVideo');
        
        modal.style.display = 'none';
        document.body.style.overflow = '';
        video.pause();
    }

    document.addEventListener('keydown', e => {
        if (e.key === 'Escape') fecharModal();
    });

    document.getElementById('modalOverlay').addEventListener('click', function(e) {
        if (e.target === this) fecharModal();
    });
</script>

{% endblock %}
